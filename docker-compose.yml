services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep standalone"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "2181:2181"
    networks:
      - uccd_net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 5
    ports:
      - "9093:9093"
    networks:
      - uccd_net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-uccd_redis_pass}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-uccd_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - uccd_net

  api:
    build: .
    ports:
      - "8888:8000"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-uccd_redis_pass}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMAIL_COMPLAINTS_CONVERSATION_MODE: ${EMAIL_COMPLAINTS_CONVERSATION_MODE:-false}
    volumes:
      - .:/app
    networks:
      - uccd_net

  openwa:
    image: openwa/openwa:latest
    ports:
      - "8081:8081"
    volumes:
      - ./openwa-data:/app/data
    environment:
      - API_KEY=${OPENWA_API_KEY}
    restart: unless-stopped
    networks:
      - uccd_net
    profiles:
      - whatsapp

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./dashboard-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - uccd_net
    restart: unless-stopped

  alpine:
    image: alpine:latest
    command: tail -f /dev/null
    networks:
      - uccd_net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  uccd_net:
    driver: bridge